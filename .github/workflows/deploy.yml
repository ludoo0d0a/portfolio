# Build Astro → Cloudflare Pages (portfolio.geoking.fr)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Pin: wrangler@4 latest fails Pages with "Failed to publish your Function"
          for attempt in 1 2 3; do
            echo "Deploy attempt ${attempt}/3"
            if npx --yes wrangler@4.40.0 pages deploy dist \
              --project-name=portfolio \
              --branch=main \
              --commit-dirty=true; then
              exit 0
            fi
            echo "Deploy failed (attempt ${attempt}); retrying in 10s…"
            sleep 10
          done
          echo "All deploy attempts failed"
          exit 1
